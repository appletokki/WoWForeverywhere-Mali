name: Mali sync and release

# Checks YoruDev-Ryland/WoWForeverywhere for a new release tag every 6 hours. When one appears, merges it
# into main (which carries the Mali support and the Korean launcher), builds the APK and publishes it
# as release <tag>-mali. A merge conflict or a failed build opens one issue per tag instead.
#
# Keeping merges clean: Mali code lives in ui/screen/wow/MaliSupport.kt, and upstream files only carry
# one-line hooks marked "// Mali hook". Resolve a conflict by keeping upstream's lines plus those hooks.
on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours (03:23, 09:23, 15:23, 21:23 KST)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and re-upload even if the -mali release already exists"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: mali-sync

env:
  UPSTREAM: https://github.com/YoruDev-Ryland/WoWForeverywhere.git

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find the latest upstream release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --tags upstream main
          TAG=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG-mali" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$TAG-mali is already released."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $TAG-mali."
          fi

      - name: Merge the upstream release
        if: steps.tag.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          TAG=${{ steps.tag.outputs.tag }}
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "main already contains $TAG"
          elif git merge --no-edit -m "Merge upstream $TAG" "$TAG"; then
            git push origin HEAD:main
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "::error::Merge conflict with $TAG in: $(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt")"
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.tag.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.tag.outputs.build == 'true'

      - name: Install the NDK
        if: steps.tag.outputs.build == 'true'
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      - name: Fetch runtime components
        if: steps.tag.outputs.build == 'true'
        run: tools/fetch_components.sh

      # Same as upstream's release.yml: the ARM64 client never uses Proton's 32-bit Windows half (about 60 MB).
      - name: Remove 32-bit Windows files from Proton
        if: steps.tag.outputs.build == 'true'
        run: |
          command -v zstd > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd > /dev/null; }
          python3 tools/trim_proton_i386.py app/src/main/assets/bundled_components/proton-11.0-90624-arm64ec.wcp

      # Same as upstream's release.yml: the browser-login helper (Settings > Account > Sign-in method > Battle.net
      # sign-in page) is built from tools/wow-session-bridge. Without it, browser login fails before the page opens.
      - name: Build the browser-login helper
        if: steps.tag.outputs.build == 'true'
        env:
          LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
          LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
        run: |
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          sh tools/wow-session-bridge/build.sh "$RUNNER_TEMP/$LLVM_MINGW/bin/aarch64-w64-mingw32-clang" \
            app/src/main/assets/wow-session-bridge.exe
          sha256sum app/src/main/assets/wow-session-bridge.exe

      - name: Configure signing
        if: steps.tag.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MALI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MALI_KEYSTORE_BASE64 is not set: the APK would not install over the existing app."
            exit 1
          fi
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/mali.jks
          {
            echo "storeFile=keystores/mali.jks"
            echo "storePassword=android"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
          } > app/keystores/keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        if: steps.tag.outputs.build == 'true'
        run: ./gradlew --no-daemon assembleModernRelease -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvm.options=-Xmx2g

      - name: Publish the release
        if: steps.tag.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          APK=dist/WoW-Foreverywhere-${TAG#v}-mali.apk
          mkdir -p dist
          cp app/build/outputs/apk/modern/release/app-modern-release.apk "$APK"
          "$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)" verify --print-certs "$APK" | grep -i "SHA-256" | head -1
          if gh release view "$TAG-mali" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG-mali" --repo "$GITHUB_REPOSITORY" "$APK" --clobber
          else
            {
              echo "WoW Foreverywhere $TAG + Mali(MediaTek Dimensity) GPU 지원 + 한국어 런처."
              echo
              echo "공식 릴리스: https://github.com/YoruDev-Ryland/WoWForeverywhere/releases/tag/$TAG"
              MISSING=$(python3 tools/mali_missing_ko.py)
              if [ "$MISSING" != "0" ]; then
                echo
                echo "아직 한국어로 번역되지 않은 새 문구 ${MISSING}개는 영어로 표시됩니다."
              fi
            } > dist/notes.md
            gh release create "$TAG-mali" --repo "$GITHUB_REPOSITORY" "$APK" --target main --title "$TAG Mali" --notes-file dist/notes.md --latest
          fi

      - name: Remove signing material
        if: always()
        run: rm -f app/keystores/mali.jks app/keystores/keystore.properties local.properties

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Mali 자동 빌드 실패: ${TAG:-unknown}"
          if [ -s "$RUNNER_TEMP/conflicts.txt" ]; then
            BODY="업스트림 ${TAG:-?} 병합 중 충돌이 났습니다. 충돌 파일:"$'\n'"$(sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt")"$'\n\n'"업스트림 줄을 살리고 '// Mali hook' 줄만 다시 넣으면 됩니다. 실행 로그: $RUN_URL"
          else
            BODY="업스트림 ${TAG:-?} 빌드 또는 배포가 실패했습니다. 실행 로그: $RUN_URL"
          fi
          # One open issue per tag: later runs comment on it instead of opening another.
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
