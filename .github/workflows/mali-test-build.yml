name: Mali test build

# Builds a branch as a pre-release (<tag>, e.g. v1.3.0-mali-test1) for trying a change on a device before it
# reaches main. The in-app updater reads releases/latest, which skips pre-releases, so players don't get it.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build"
        required: true
        default: main
      tag:
        description: "Pre-release tag, e.g. v1.3.0-mali-test1"
        required: true

permissions:
  contents: write

concurrency:
  group: mali-test-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MALI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MALI_KEYSTORE_BASE64 is not set: the APK would not install over the existing app."
            exit 1
          fi
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/mali.jks
          {
            echo "storeFile=keystores/mali.jks"
            echo "storePassword=android"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
          } > app/keystores/keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: ./gradlew --no-daemon assembleModernRelease -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvm.options=-Xmx2g

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
        run: |
          APK="dist/WoW-Foreverywhere-${TAG#v}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/modern/release/app-modern-release.apk "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$APK" --clobber
          else
            echo "Mali 시험 빌드 ($REF, $(git rev-parse --short HEAD)). 앱 안 업데이트로는 받지 않습니다." > dist/notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "$APK" --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file dist/notes.md --prerelease
          fi

      - name: Remove signing material
        if: always()
        run: rm -f app/keystores/mali.jks app/keystores/keystore.properties local.properties
